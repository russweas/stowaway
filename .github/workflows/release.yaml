name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Release Linux x86_64 binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare release asset
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          package_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$version" = "$package_version" || {
            echo "tag $TAG does not match Cargo.toml version $package_version" >&2
            exit 1
          }
          asset="stowaway-${version}-x86_64-unknown-linux-gnu"
          mkdir -p dist
          install -Dm755 target/release/stowaway "dist/$asset/stowaway"
          tar -C dist -czf "dist/$asset.tar.gz" "$asset"
          sha256sum "dist/$asset.tar.gz" > "dist/$asset.tar.gz.sha256"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/stowaway-${TAG#v}-x86_64-unknown-linux-gnu.tar.gz" \
            "dist/stowaway-${TAG#v}-x86_64-unknown-linux-gnu.tar.gz.sha256" \
            --target "$GITHUB_SHA" \
            --title "Stowaway $TAG" \
            --generate-notes
