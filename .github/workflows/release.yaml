name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Release Linux x86_64 binary
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test
        run: cargo test --locked

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Prepare release asset
        run: |
          install -Dm755 target/release/stowaway dist/stowaway-linux-x86_64
          sha256sum dist/stowaway-linux-x86_64 > dist/stowaway-linux-x86_64.sha256

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/stowaway-linux-x86_64 \
            dist/stowaway-linux-x86_64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Stowaway $TAG" \
            --generate-notes
